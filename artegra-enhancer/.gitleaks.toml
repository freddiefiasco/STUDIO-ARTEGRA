# Gitleaks settings for this repository: the default rules, with one narrow exception.
[extend]
useDefault = true

# Earlier versions of this test fixture put each pinned SHA-256 straight after its file name, which the generic rule
# reads as an assignment. The fixture now lists {"path", "sha256"} objects. Only that rule skips only this file.
[[allowlists]]
description = "Pinned source-file hashes in the merge test fixture"
targetRules = ["generic-api-key"]
paths = ['''(?:^|/)tests/fixtures/beta-normalised-hashes[.]json$''']

# The blind-comparison kit names its two record formats in one line (tools/proof/pairs.py, KEY_FORMAT and PAIRS_FORMAT),
# which the generic rule reads as a key. Only that rule skips only those two labels in only that file.
[[allowlists]]
description = "The blind-comparison kit's record format labels"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''(?:^|/)tools/proof/pairs[.]py$''']
regexes = ['''^cu-blind-(?:key|pairs)-1$''']
